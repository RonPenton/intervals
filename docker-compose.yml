version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: intervals
      POSTGRES_PASSWORD: intervals
      POSTGRES_DB: intervals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervals"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: intervals
      PGUSER: intervals
      PGPASSWORD: intervals
    env_file:
      - .env.json         # mounted so dotenv-json2 can read it at runtime
    volumes:
      - ./.env.json:/app/.env.json:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
